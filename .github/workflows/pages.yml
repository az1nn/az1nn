name: Deploy interactive profile

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: profile-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Stage production profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html styles.css app.js dist/
          if [ -d assets ]; then
            cp -R assets dist/assets
          fi
          if [ -f PROFILE_VERSION ]; then
            cp PROFILE_VERSION dist/PROFILE_VERSION
          fi
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
