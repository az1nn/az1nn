<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Az1nn Human + AI Three.js profile preview</title>
  <desc id="desc">A dark technical space with the AZ1NN core, a cyan AI Twin and connected project nodes.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#17112d"/>
      <stop offset="0.52" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#06080d"/>
    </radialGradient>
    <radialGradient id="core" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset="0.32" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </radialGradient>
    <radialGradient id="twin" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.32" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8b5cf6" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <g stroke="#8b5cf6" stroke-opacity=".35" stroke-width="1.5">
    <path d="M600 210L290 112"/><path d="M600 210L915 105"/><path d="M600 210L1010 274"/><path d="M600 210L760 330"/><path d="M600 210L390 323"/>
  </g>
  <path d="M600 210L710 148" stroke="#38bdf8" stroke-width="2.2" stroke-opacity=".65" stroke-dasharray="5 7"/>
  <g fill="#8b5cf6" opacity=".18">
    <circle cx="150" cy="80" r="2"/><circle cx="210" cy="260" r="1.5"/><circle cx="1090" cy="95" r="2"/><circle cx="1020" cy="350" r="1.5"/><circle cx="535" cy="66" r="2"/><circle cx="705" cy="92" r="1.5"/><circle cx="850" cy="225" r="1.5"/><circle cx="320" cy="210" r="1.5"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="600" cy="210" r="72" fill="#7c3aed" fill-opacity=".16"/>
    <circle cx="600" cy="210" r="49" fill="url(#core)"/>
  </g>
  <text x="600" y="216" text-anchor="middle" fill="#fff" font-family="Inter,ui-sans-serif,system-ui" font-weight="800" font-size="18" letter-spacing="3">AZ1NN</text>
  <g filter="url(#cyanGlow)">
    <circle cx="710" cy="148" r="48" fill="#38bdf8" fill-opacity=".10"/>
    <circle cx="710" cy="148" r="31" fill="url(#twin)" fill-opacity=".86"/>
    <circle cx="710" cy="148" r="38" fill="none" stroke="#7dd3fc" stroke-opacity=".56" stroke-dasharray="4 5"/>
  </g>
  <text x="710" y="153" text-anchor="middle" fill="#f0f9ff" font-family="Inter,ui-sans-serif,system-ui" font-weight="800" font-size="11" letter-spacing="1.8">AI TWIN</text>
  <g font-family="Inter,ui-sans-serif,system-ui">
    <g transform="translate(290 112)"><circle r="18" fill="#111827" stroke="#8b5cf6"/><text y="42" text-anchor="middle" fill="#c9d1d9" font-size="14">OpenBand</text></g>
    <g transform="translate(915 105)"><circle r="18" fill="#111827" stroke="#8b5cf6"/><text y="42" text-anchor="middle" fill="#c9d1d9" font-size="14">CPXLABS Admin</text></g>
    <g transform="translate(1010 274)"><circle r="18" fill="#111827" stroke="#8b5cf6"/><text y="42" text-anchor="middle" fill="#c9d1d9" font-size="14">PG Researcher</text></g>
    <g transform="translate(760 330)"><circle r="18" fill="#111827" stroke="#8b5cf6"/><text y="42" text-anchor="middle" fill="#c9d1d9" font-size="14">CPX Labs</text></g>
    <g transform="translate(390 323)"><circle r="18" fill="#111827" stroke="#8b5cf6"/><text y="42" text-anchor="middle" fill="#c9d1d9" font-size="14">More systems</text></g>
  </g>
  <text x="48" y="64" fill="#fff" font-family="Inter,ui-sans-serif,system-ui" font-size="28" font-weight="750">Human + AI constellation</text>
  <text x="48" y="92" fill="#8b949e" font-family="Inter,ui-sans-serif,system-ui" font-size="15">Explore projects, systems and the holographic AI Twin in Three.js.</text>
  <g transform="translate(48 340)">
    <rect width="230" height="44" rx="22" fill="#7c3aed"/>
    <text x="115" y="28" text-anchor="middle" fill="#fff" font-family="Inter,ui-sans-serif,system-ui" font-weight="700" font-size="14">OPEN HUMAN + AI PROFILE ↗</text>
  </g>
</svg>
